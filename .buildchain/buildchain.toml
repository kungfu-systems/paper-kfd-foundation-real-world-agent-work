schema = 1

[project]
type = "publication-artifact"
name = "paper-kfd-foundation-real-world-agent-work"

[publication]
kind = "paper"
title = "Facts, Trust, and Boundary Primitives: A Foundation Model for Real-World Agent Work"
version = "0.1.0-alpha.7"
abstract = "A foundation and systems design paper for discovering and validating boundary primitives in real-world agent work."
authors = [ "Keren Dong" ]
primary_artifact = "_build/kfd-foundation-model.pdf"
artifact_paths = [ "_build/kfd-foundation-model.pdf" ]
metadata_paths = [ "README.md", "docs/MAP.md" ]
source_paths = [ "paper", "README.md", "LICENSE", "Makefile" ]
site_consumers = [ "papers.libkungfu.dev" ]
manifest_path = ".buildchain/publication/publication-artifact.json"
source_bundle_path = ".buildchain/publication/source.tar.gz"

[publication.archive]
id = "kfd-foundation-real-world-agent-work"
canonical_url = "https://papers.libkungfu.dev/kfd-foundation-real-world-agent-work/"
latest_url = "https://papers.libkungfu.dev/kfd-foundation-real-world-agent-work/latest/"
latest_evidence_url = "https://papers.libkungfu.dev/kfd-foundation-real-world-agent-work/latest/buildchain.release.json"
immutable_base_url = "https://papers.libkungfu.dev/archive"
registry_path = ".buildchain/publication/publication-registry.json"

[publication.toolchain]
type = "latex-docker"
image = "ghcr.io/kungfu-systems/build-images/latex-pdf-builder"
digest = "sha256:f4dc7cb0e0b23cfc2fcde663a65f36c5e71e3ae8e6477e5a24f7ad5237300f10"
command = "mkdir -p _build && cd paper && latexmk -pdf -outdir=../_build main.tex && mv ../_build/main.pdf ../_build/kfd-foundation-model.pdf"

[publish]
kind = "npm-paper-package"
package = "@kungfu-tech/paper-kfd-foundation-real-world-agent-work"
auth = "trusted-publishing"

[version]
required = true

[[version.files]]
type = "toml"
path = ".buildchain/buildchain.toml"
key = "publication.version"

[lifecycle.install]
command = "true"

[lifecycle.verify]
command = "make check"
